{% extends "control_panel/base.html" %}
{% block title %}Create Course Coupon | Control Panel{% endblock %}
{% block content %}
<div class="cp-page-header">
  <h1 class="cp-page-title">Create Course Coupon</h1>
</div>

<div class="cp-card" style="max-width: 500px;">
  <form method="POST" action="" style="display: flex; flex-direction: column; gap: 16px;">
    {% csrf_token %}
    <div>
      <label style="font-size: 11px; font-weight: 600; color: var(--cp-text-muted);">COUPON CODE</label>
      <input type="text" name="code" placeholder="CUBIX20" class="cp-login-field" style="height: 40px; padding-left: 12px;" required>
    </div>
    <div>
      <label style="font-size: 11px; font-weight: 600; color: var(--cp-text-muted);">COURSE</label>
      <select name="course_id" class="cp-login-field" style="height: 40px; padding-left: 12px;" required>
        {% for course in courses %}
          <option value="{{ course.id }}">{{ course.academy.name }} &bull; {{ course.title }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label style="font-size: 11px; font-weight: 600; color: var(--cp-text-muted);">DISCOUNT AMOUNT (INR)</label>
      <input type="number" step="0.01" name="discount_value" placeholder="500.00" class="cp-login-field" style="height: 40px; padding-left: 12px;" required>
    </div>
    <button type="submit" class="cp-btn cp-btn-primary" style="height: 42px; margin-top: 8px;">Create Coupon</button>
  </form>
</div>
{% endblock %}
