name: Backend configuration smoke tests

on:
  pull_request:
    paths:
      - "config/**"
      - "apps/core/test_environment.py"
      - "apps/authentication/**"
      - "apps/leads/**"
      - ".env.example"
      - "docs/environment-configuration.md"
      - ".github/workflows/backend-environment-tests.yml"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "apps/core/test_environment.py"
      - "apps/authentication/**"
      - "apps/leads/**"
      - ".github/workflows/backend-environment-tests.yml"
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cubixskill_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cubixskill_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: github-actions-configuration-smoke-secret-not-production
      DATABASE_URL: postgresql://ci:ci_only_password@localhost:5432/cubixskill_ci
      USE_REDIS_CHANNELS: "False"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q config apps
      - run: python manage.py check
      - run: python manage.py makemigrations leads --check --dry-run
      - run: python manage.py test core.test_environment leads.test_platform_demo --noinput
