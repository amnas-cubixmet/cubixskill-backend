name: Storage billing regression tests

on:
  pull_request:
    paths:
      - "apps/storage/**"
      - "apps/control_panel/forms.py"
      - "apps/control_panel/templates/control_panel/billing/storage_settings.html"
      - ".github/workflows/storage-billing-tests.yml"
  workflow_dispatch:

jobs:
  storage-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cubixskill_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cubixskill_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      USE_REDIS_CHANNELS: "False"
      DATABASE_URL: postgresql://ci:ci_only_password@localhost:5432/cubixskill_ci
      SECRET_KEY: github-ci-storage-only-key-not-for-production-2026
      CELERY_TASK_ALWAYS_EAGER: "True"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test storage.test_settings_security storage.test_settlement_audit control_panel.tests --noinput
