name: Instructor signup and activation tests

on:
  pull_request:
    paths:
      - "apps/authentication/**"
      - "apps/emails/**"
      - ".github/workflows/instructor-signup.yml"
  push:
    branches: [main]
    paths:
      - "apps/authentication/**"
      - "apps/emails/**"
      - ".github/workflows/instructor-signup.yml"
  workflow_dispatch:

jobs:
  test-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cubixskill_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cubixskill_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: github-ci-instructor-signup-not-production
      DATABASE_URL: postgresql://ci:ci_only_password@localhost:5432/cubixskill_ci
      USE_REDIS_CHANNELS: "False"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q apps/authentication apps/emails
      - run: python manage.py check
      - run: python manage.py makemigrations authentication emails --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test authentication.test_academy_signup authentication.test_instructor_registration --noinput
